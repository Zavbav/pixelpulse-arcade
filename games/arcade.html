<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PixelPulse Arcade Game</title><style>
:root{color-scheme:dark;--cyan:#67e8f9;--violet:#a78bfa}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#1e2c55,#070b16 70%);font-family:system-ui,Arial;color:#f8fafc;display:grid;place-items:center;padding:16px}.shell{width:min(760px,100%);background:#0b1223;border:1px solid #334155;border-radius:22px;padding:clamp(16px,4vw,28px);box-shadow:0 25px 70px #0008}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{margin:0;font-size:clamp(1.6rem,5vw,2.6rem)}p{color:#cbd5e1;line-height:1.5}button{border:0;border-radius:12px;padding:12px 16px;background:linear-gradient(120deg,var(--cyan),#a7f3d0);color:#07111f;font-weight:800;font-size:1rem;cursor:pointer}.board{margin-top:18px;min-height:330px;border-radius:16px;border:1px solid #334155;background:linear-gradient(#101b32,#080d19);display:grid;place-items:center;position:relative;overflow:hidden;padding:20px;text-align:center}.big{font-size:clamp(3rem,12vw,6rem);line-height:1.1;margin:10px}.hint{font-size:1rem}.score{color:var(--cyan);font-weight:800}.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:16px}.tap{font-size:3rem;border-radius:50%;width:130px;height:130px;padding:0}.tiles{display:grid;grid-template-columns:repeat(3,minmax(60px,95px));gap:10px}.tiles button{height:70px;font-size:1.5rem}.hidden{display:none!important}a{color:var(--cyan)}.notice{font-size:.85rem;color:#94a3b8}
</style></head><body><main class="shell"><header><div><p class="notice">PIXELPULSE ARCADE · MINI GAME</p><h1 id="title">Arcade Game</h1></div><button id="back">← Games</button></header><p id="desc">Play instantly in your browser. No downloads.</p><div class="board" id="board" aria-live="polite"></div><div class="controls"><button id="restart">Restart</button><button id="sound">Sound: Off</button></div><p class="notice">These are original PixelPulse mini-games inspired by arcade genres, not copies of third-party game code.</p></main><script>
const id=new URLSearchParams(location.search).get('id')||'star-burst';const names={'goal-rush':'Goal Rush','memory-pulse':'Memory Pulse','star-burst':'Star Burst','galaxy-duel':'Galaxy Duel','basket-random':'Basket Random','cookie-clicker':'Cookie Clicker','slope-classic':'Slope Classic','moto-x3m':'Moto X3M'};const title=document.querySelector('#title'),desc=document.querySelector('#desc'),board=document.querySelector('#board');title.textContent=names[id]||'Arcade Challenge';let score=0,timer=null,step=0,sequence=[],sound=false;const showScore=()=>'<p class="score">Score: '+score+'</p>';function start(){clearInterval(timer);score=0;step=0;sequence=[];if(id==='cookie-clicker'){desc.textContent='Tap the cookie as many times as you can. Build your score!';board.innerHTML='<div><div class="big">🍪</div><p class="score" id="score">Cookies: 0</p><button class="tap" id="tap">🍪</button></div>';document.querySelector('#tap').onclick=()=>{score++;document.querySelector('#score').textContent='Cookies: '+score};return}
if(id==='memory-pulse'){desc.textContent='Remember the sequence, then repeat it by tapping the colored buttons.';sequence=Array.from({length:4},()=>Math.floor(Math.random()*4));board.innerHTML='<div><p id="message">Memorize this sequence: '+sequence.map(n=>['🔵','🟣','🟢','🟠'][n]).join(' ')+'</p><div class="tiles">'+['🔵','🟣','🟢','🟠'].map((v,n)=>'<button data-n="'+n+'">'+v+'</button>').join('')+'</div><p id="feedback"></p></div>';setTimeout(()=>document.querySelector('#message').textContent='Your turn! Repeat the sequence.',1800);let input=[];board.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{input.push(+b.dataset.n);if(input[input.length-1]!==sequence[input.length-1]){document.querySelector('#feedback').textContent='Not quite — restart and try again.';return}if(input.length===sequence.length){score=sequence.length;document.querySelector('#feedback').textContent='Perfect memory! You win!'}});return}
if(id==='goal-rush'){desc.textContent='Tap SHOOT to kick the ball. Aim to score as many goals as possible.';board.innerHTML='<div><div class="big">🥅</div><div class="big" id="ball">⚽</div><p class="score" id="score">Goals: 0</p><button id="tap">SHOOT!</button><p id="feedback"></p></div>';document.querySelector('#tap').onclick=()=>{const goal=Math.random()>.35;if(goal)score++;document.querySelector('#score').textContent='Goals: '+score;document.querySelector('#feedback').textContent=goal?'GOAL! ⚽':'Saved by the keeper!'};return}
if(id==='basket-random'){desc.textContent='Tap the ball to shoot. Make as many baskets as you can.';board.innerHTML='<div><div class="big">🏀</div><p class="score" id="score">Baskets: 0</p><button id="tap">SHOOT</button><p id="feedback"></p></div>';document.querySelector('#tap').onclick=()=>{let made=Math.random()>.4;if(made)score++;document.querySelector('#score').textContent='Baskets: '+score;document.querySelector('#feedback').textContent=made?'SWISH! 🏀':'Missed — shoot again!'};return}
if(id==='star-burst'){desc.textContent='Click the stars before they disappear. Every hit earns a point.';board.innerHTML='<div><p class="score" id="score">Score: 0</p><button class="tap" id="target">⭐</button><p id="feedback">Ready? Tap the star!</p></div>';document.querySelector('#target').onclick=()=>{score++;document.querySelector('#score').textContent='Score: '+score;document.querySelector('#target').textContent=['⭐','🌟','💫'][Math.floor(Math.random()*3)];document.querySelector('#feedback').textContent='Nice hit! Keep going.'};return}
if(id==='galaxy-duel'){desc.textContent='Defend your ship! Tap the alien targets to score before they escape.';board.innerHTML='<div><p class="score" id="score">Hits: 0</p><button class="tap" id="target">👾</button><p id="feedback">Tap the target!</p></div>';document.querySelector('#target').onclick=()=>{score++;document.querySelector('#score').textContent='Hits: '+score;document.querySelector('#target').textContent=['👾','🛸','💥'][Math.floor(Math.random()*3)];document.querySelector('#feedback').textContent='Direct hit!'};return}
if(id==='moto-x3m'){desc.textContent='Press JUMP to clear the obstacles and ride farther. Works on touch screens too.';board.innerHTML='<div><div class="big" id="rider">🏍️</div><p class="score" id="score">Distance: 0</p><button id="tap">JUMP</button><p id="feedback">Avoid the obstacles!</p></div>';document.querySelector('#tap').onclick=()=>{let ok=Math.random()>.25;if(ok)score+=10;document.querySelector('#score').textContent='Distance: '+score;document.querySelector('#feedback').textContent=ok?'Clean landing!':'Crash! Try again.';document.querySelector('#rider').textContent=ok?'🏍️':'💥'};return}
desc.textContent='Dodge the red obstacles. Use the left and right buttons to stay alive.';board.innerHTML='<div><div class="big" id="player">🔴</div><p class="score" id="score">Distance: 0</p><div class="controls"><button id="left">← LEFT</button><button id="right">RIGHT →</button></div><p id="feedback">Pick a lane to start.</p></div>';let lane=1;const move=d=>{lane=Math.max(0,Math.min(2,lane+d));score+=1;document.querySelector('#player').textContent=['🔵','🔴','🟢'][lane];document.querySelector('#score').textContent='Distance: '+score;document.querySelector('#feedback').textContent=Math.random()>.25?'Nice dodge!':'Close call!'};document.querySelector('#left').onclick=()=>move(-1);document.querySelector('#right').onclick=()=>move(1);window.onkeydown=e=>{if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1)}}
document.querySelector('#back').onclick=()=>window.top.location.href='../index.html';document.querySelector('#restart').onclick=start;document.querySelector('#sound').onclick=e=>{sound=!sound;e.target.textContent='Sound: '+(sound?'On':'Off')};start();
</script></body></html>
