<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PixelPulse Arcade — Play</title>
<style>
:root{color-scheme:dark;--bg:#07111f;--panel:#101f33;--line:#29415e;--ink:#eef7ff;--muted:#9db2cb;--a:#65e4ff;--b:#a58bff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#183354 0,transparent 55%),var(--bg);font:16px system-ui,sans-serif;color:var(--ink);display:grid;place-items:center;padding:18px}
main{width:min(100%,900px)}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}h1{font-size:clamp(1.6rem,4vw,2.6rem);margin:0}button{font:inherit;font-weight:750;border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:#182b43;color:var(--ink);cursor:pointer}button:hover{border-color:var(--a)}.hud{display:flex;gap:10px;align-items:center;color:var(--muted)}.score{font-size:1.3rem;color:var(--a);font-weight:900}.stage{position:relative;overflow:hidden;min-height:460px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(180deg,#142e4b,#091524);box-shadow:0 24px 80px #0008}.stage canvas{display:block;width:100%;height:auto;touch-action:none}.under{display:flex;flex-wrap:wrap;gap:9px;justify-content:space-between;align-items:center;margin-top:12px;color:var(--muted)}.controls{display:flex;gap:8px;flex-wrap:wrap}.big{background:linear-gradient(120deg,var(--a),var(--b));color:#06111d;border:0}.notice{position:absolute;inset:0;display:grid;place-items:center;text-align:center;background:#06111ddd;padding:24px}.notice h2{font-size:2rem;margin:0 0 8px}.notice p{color:var(--muted)}.notice.hidden{display:none}.tap{font-size:clamp(1.2rem,3vw,2rem);font-weight:850}.touch{display:flex;gap:10px;justify-content:center;margin-top:10px}.touch button{min-width:76px}@media(max-width:600px){.stage{min-height:390px}header{align-items:flex-start}.hud{flex-direction:column;align-items:flex-end}}
</style></head>
<body><main><header><div><div style="font-size:.75rem;letter-spacing:.2em;color:var(--a);font-weight:800">PIXELPULSE / ARCADE</div><h1 id="title">Loading game</h1></div><button id="back">← Library</button></header><div class="hud"><span id="help">Made to play right here — no external game sites.</span><span> SCORE <b id="score" class="score">0</b></span></div><section class="stage"><canvas id="c" width="900" height="520"></canvas><div id="notice" class="notice hidden"><div><h2 id="nt">Game over</h2><p id="np">Try again.</p><button id="again" class="big">Play again</button></div></div></section><div class="touch" id="touch"></div><div class="under"><span id="instructions">Use keyboard or touch controls.</span><div class="controls"><button id="pause">Pause</button><button id="restart" class="big">Restart</button></div></div></main>
<script>
const $=id=>document.getElementById(id), c=$('c'),x=c.getContext('2d');
const id=new URLSearchParams(location.search).get('game')||'basket-random';
const names={'retro-bowl':'Fourth Down','snow-rider-3d':'Snowline','moto-x3m':'Moto Rush','basket-random':'Basket Random','cookie-clicker':'Cookie Factory','basketball-stars':'Hoop Shot','run-3':'Tunnel Runner','drift-boss':'Drift Boss','monkey-mart':'Market Dash'};
$('title').textContent=names[id]||'PixelPulse Arcade';
$('back').onclick=()=>location.href='../index.html';
let score=0,over=false,paused=false,frame=0,keys={},player={x:450,y:400,vx:0,vy:0},objects=[],coins=0,clicks=0,hoops=0,stock=0,world=0,ball={x:450,y:390,vx:0,vy:0},last=0;
const setScore=n=>{$('score').textContent=Math.floor(n)};
function text(t,xx,yy,size=24,color='#eef7ff'){x.fillStyle=color;x.font='800 '+size+'px system-ui';x.fillText(t,xx,yy)}
function rect(xx,yy,w,h,col){x.fillStyle=col;x.fillRect(xx,yy,w,h)}
function circle(xx,yy,r,col){x.fillStyle=col;x.beginPath();x.arc(xx,yy,r,0,Math.PI*2);x.fill()}
function reset(){score=0;over=false;paused=false;frame=0;objects=[];coins=0;clicks=0;hoops=0;stock=0;world=0;player={x:450,y:390,vx:0,vy:0};ball={x:450,y:390,vx:0,vy:0};$('notice').classList.add('hidden');$('pause').textContent='Pause';$('touch').innerHTML='';initControls();draw()}
function end(msg='Round over'){over=true;$('nt').textContent=msg;$('np').textContent='Score: '+Math.floor(score)+'. Run it back.';$('notice').classList.remove('hidden')}
function initControls(){
 const add=(label,fn)=>{const b=document.createElement('button');b.textContent=label;b.onclick=fn;$('touch').appendChild(b)};
 if(id==='cookie-clicker'||id==='monkey-mart'){add(id==='cookie-clicker'?'BAKE COOKIES':'RESTOCK',()=>{score+=id==='cookie-clicker'?1:3;clicks++;draw()})}
 else if(id==='retro-bowl'||id==='basketball-stars'||id==='basket-random'){add('←',()=>{player.x=Math.max(70,player.x-65);draw()});add('THROW / SHOOT',()=>shoot());add('→',()=>{player.x=Math.min(830,player.x+65);draw()})}
 else {add('←',()=>{keys.ArrowLeft=true;setTimeout(()=>keys.ArrowLeft=false,180)});add('JUMP / BOOST',()=>{player.vy=-12;player.vx+=1});add('→',()=>{keys.ArrowRight=true;setTimeout(()=>keys.ArrowRight=false,180)})}
}
function shoot(){if(id==='retro-bowl'){objects.push({x:player.x,y:player.y-15,vx:(450-player.x)*.055,vy:-7,kind:'ball'});score+=Math.random()>.35?7:2}else if(id==='basketball-stars'||id==='basket-random'){objects.push({x:player.x,y:player.y-15,vx:(700-player.x)*.035,vy:-11,kind:'ball'});score+=Math.random()>.4?2:0}setScore(score)}
$('again').onclick=reset;$('restart').onclick=reset;$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'Resume':'Pause'};
window.addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowLeft','ArrowRight','ArrowUp',' '].includes(e.key))e.preventDefault();if(e.key===' '||e.key==='ArrowUp')player.vy=-11;if(e.key==='Enter'&&over)reset();if(e.key==='Escape')paused=!paused;if(e.key===' '&&id==='retro-bowl')shoot()});
window.addEventListener('keyup',e=>keys[e.key]=false);
c.addEventListener('pointerdown',e=>{const r=c.getBoundingClientRect(),px=(e.clientX-r.left)*c.width/r.width;if(id==='cookie-clicker'){score++;clicks++}else if(id==='monkey-mart'){score+=3;stock++}else if(id.includes('basket')||id==='retro-bowl')shoot();else{player.vx=px<450?-5:5;if(id==='snow-rider-3d'||id==='moto-x3m'||id==='run-3')player.vy=-8}setScore(score)});
function draw(){x.clearRect(0,0,c.width,c.height);let g=x.createLinearGradient(0,0,0,520);g.addColorStop(0,'#173859');g.addColorStop(1,'#081321');x.fillStyle=g;x.fillRect(0,0,900,520);
 if(id==='cookie-clicker'){text('COOKIE FACTORY',45,65,25,'#ffc879');for(let i=0;i<Math.min(24,clicks+1);i++){let xx=120+(i%8)*92,yy=140+Math.floor(i/8)*95;circle(xx,yy,27,'#bd783f');for(let j=0;j<5;j++)circle(xx+Math.cos(i+j*2)*15,yy+Math.sin(i+j*2)*15,3,'#513021')}text('Click to bake. Every click earns a cookie.',45,450,20);text('COOKIES: '+score,45,490,24,'#ffc879')}
 else if(id==='monkey-mart'){rect(35,100,830,340,'#244b46');for(let row=0;row<3;row++){rect(90,150+row*90,720,12,'#b47b4c');for(let j=0;j<7;j++){circle(130+j*100,135+row*90,13,['#ffd166','#79d279','#ff8d7a'][j%3])}}circle(450,385,24,'#d89c64');circle(442,378,5,'#111');circle(458,378,5,'#111');text('MARKET DASH',45,65,25);text('Restock shelves to earn coins',45,475,20);text('COINS '+score,690,65,22,'#ffd166')}
 else if(id==='retro-bowl'){rect(0,80,900,440,'#1e704c');for(let yy=100;yy<520;yy+=55){rect(0,yy,900,2,'#8fdaa3')}for(let xx=80;xx<900;xx+=160){rect(xx,80,2,440,'#8fdaa3')}rect(0,80,8,440,'#fff');rect(892,80,8,440,'#fff');circle(player.x,390,20,'#ffb34f');rect(player.x-14,377,28,28,'#e88b3e');text('FOURTH DOWN',35,45,25);text('Move left/right, then throw for a pass',35,490,20);text('TARGET',680,110,16,'#bfffd4');circle(710+Math.sin(frame/35)*90,160,13,'#fff');}
 else if(id==='basketball-stars'||id==='basket-random'){rect(0,80,900,440,'#b97748');rect(0,80,900,7,'#f4d3a0');for(let yy=120;yy<520;yy+=60)rect(0,yy,900,2,'#e2b28b');x.strokeStyle='#f8e1bd';x.lineWidth=4;x.beginPath();x.arc(450,300,115,0,Math.PI*2);x.stroke();rect(695,180,5,115,'#fff');rect(660,180,70,5,'#fff');circle(690,300,16,'#ff963c');circle(player.x,400,20,'#5ce4ff');text(id==='basket-random'?'BASKET RANDOM':'HOOP SHOT',35,45,25);text('Shoot toward the hoop. Score points!',35,490,20)}
 else if(id==='snow-rider-3d'){rect(0,80,900,440,'#dceeff');for(let i=0;i<28;i++){let yy=(i*37+frame*5)%460+60;circle((i*113+Math.sin(frame/20+i)*20)%900,yy,2,'#fff')}x.fillStyle='#8eb7df';x.beginPath();x.moveTo(250,520);x.lineTo(440,70);x.lineTo(650,520);x.fill();for(let o of objects){rect(o.x,o.y,36,36,'#c47c48')}rect(player.x-18,400,36,58,'#ed5a67');text('SNOWLINE',35,45,25,'#fff');text('Dodge the trees. Move with ← →',35,490,20,'#173859')}
 else if(id==='moto-x3m'){rect(0,80,900,440,'#3c754e');rect(0,410,900,110,'#b9814d');for(let i=0;i<12;i++){circle((i*97-frame*3)%900,385+(i%3)*14,9,'#efcf83')}circle(player.x,385,23,'#111');circle(player.x,385,13,'#e8e8e8');rect(player.x-7,350,40,12,'#ff5c63');text('MOTO RUSH',35,45,25);text('Jump gaps and keep moving!',35,490,20)}
 else if(id==='run-3'){rect(160,80,580,440,'#14253b');for(let i=0;i<8;i++){rect(185+i*70,100,2,420,'#2c4c70')}for(let i=0;i<10;i++){rect(160,110+i*42,580,2,'#2c4c70')}rect(player.x-16,player.y,32,32,'#f4d35e');text('TUNNEL RUNNER',35,45,25);text('Jump and avoid the red barriers',35,490,20)}
 else if(id==='drift-boss'){rect(0,80,900,440,'#183b34');x.strokeStyle='#f3d36a';x.lineWidth=5;x.setLineDash([20,15]);x.beginPath();x.moveTo(450,80);x.lineTo(450,520);x.stroke();x.setLineDash([]);rect(360,80,180,440,'#3e514d');rect(player.x-20,380,40,65,'#6ae1ff');text('DRIFT BOSS',35,45,25);text('Steer carefully. Stay on the road!',35,490,20)}
 else { // local obstacle runner fallback
 rect(0,430,900,90,'#24445c');for(let i=0;i<10;i++)rect((i*110-frame*4)%900,430,55,5,'#5fe4ff');rect(player.x-18,player.y,36,36,'#65e4ff');for(let o of objects)rect(o.x,o.y,o.w||35,o.h||35,'#ff5b72');text('ARCADE RUN',35,45,25);text('Move and jump to survive',35,490,20)}
 for(const o of objects){if(o.kind==='ball'){circle(o.x,o.y,10,'#ffad45')}else if(id==='snow-rider-3d'){rect(o.x,o.y,34,40,'#245f42')}else{rect(o.x,o.y,o.w||30,o.h||30,'#ff5b72')}}
 if(id==='retro-bowl'||id==='basketball-stars'||id==='basket-random'){circle(player.x,400,18,id==='retro-bowl'?'#ffad45':'#65e4ff')}
 if(over){text('ROUND OVER',350,250,32,'#fff')}
}
function tick(t){requestAnimationFrame(tick);if(!last)last=t;let dt=Math.min(2,(t-last)/16.7);last=t;if(paused||over){draw();return}frame+=dt;
 if(id==='cookie-clicker'||id==='monkey-mart'){score+=id==='cookie-clicker'?0.015:0.005}
 else if(id==='retro-bowl'||id==='basketball-stars'||id==='basket-random'){if(keys.ArrowLeft||keys.a)player.x-=5*dt;if(keys.ArrowRight||keys.d)player.x+=5*dt;player.x=Math.max(35,Math.min(865,player.x));for(let o of objects){o.x+=o.vx*dt;o.y+=o.vy*dt;o.vy+=.22*dt;if(o.y<140&&o.y>100&&o.x>640){score+=id==='retro-bowl'?7:2;o.hit=true}}objects=objects.filter(o=>o.y<540&&!o.hit)}
 else {if(keys.ArrowLeft||keys.a)player.x-=6*dt;if(keys.ArrowRight||keys.d)player.x+=6*dt;player.x=Math.max(25,Math.min(875,player.x));player.vy+=.55*dt;player.y+=player.vy*dt;if(player.y>390){player.y=390;player.vy=0}if(frame%55<dt){objects.push({x:Math.random()*820+40,y:425,w:28+Math.random()*25,h:35})}for(let o of objects){o.x-= (id==='snow-rider-3d'?3.5:4.5)*dt;o.y+=id==='snow-rider-3d'?2*dt:0;if(Math.abs(o.x-player.x)<30&&o.y>350&&o.y<445){end('Crash!')}}objects=objects.filter(o=>o.x>-60);score+=.08*dt}
 setScore(score);draw();if(frame>9000)end('Nice run!')}
$('instructions').textContent=({'retro-bowl':'Arrow keys move. Press Space or Throw to pass the ball.','snow-rider-3d':'Use ← → or tap left/right to dodge trees.','moto-x3m':'Use ← → to steer and Jump to clear obstacles.','basket-random':'Move left/right and shoot toward the hoop.','cookie-clicker':'Click the stage or Bake Cookies to grow your score.','basketball-stars':'Move and shoot to score baskets.','run-3':'Move left/right and jump over barriers.','drift-boss':'Steer with ← → to keep control.','monkey-mart':'Restock shelves to earn coins.'})[id]||'Use keyboard or touch controls.';
reset();
requestAnimationFrame(tick);
</script></body></html>
