<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2048</title>
    <style>
      :root {
        --bg: #0d1728;
        --panel: rgba(18, 27, 41, 0.94);
        --board: #1d2a3d;
        --text: #edf6ff;
        --muted: #a8bfdc;
        --accent: #8f7bff;
        --accent-2: #6ad7ff;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, sans-serif;
        background: linear-gradient(180deg, #091421, #101d2d 35%, #0d1527 100%);
        color: var(--text);
      }
      body {
        display: grid;
        place-items: center;
        padding: 20px;
      }
      .game-wrap {
        width: min(94vw, 420px);
        background: var(--panel);
        border: 1px solid rgba(150, 172, 255, 0.18);
        border-radius: 22px;
        box-shadow: 0 24px 46px rgba(2, 8, 20, 0.5);
        padding: 18px;
      }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 18px;
      }
      h1 {
        margin: 0;
        font-size: clamp(1.8rem, 4vw, 2.6rem);
      }
      .score-panel {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .pill {
        min-width: 92px;
        padding: 8px 10px;
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(160, 179, 255, 0.14);
        border-radius: 12px;
        text-align: center;
      }
      .pill-label {
        display: block;
        font-size: 0.68rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .pill-value {
        display: block;
        margin-top: 2px;
        font-weight: 800;
        font-size: 1.25rem;
      }
      .board-wrap {
        position: relative;
      }
      .board {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        background: var(--board);
        border-radius: 18px;
        padding: 10px;
        aspect-ratio: 1;
        touch-action: none;
      }
      .cell {
        display: grid;
        place-items: center;
        background: rgba(255,255,255,0.08);
        border-radius: 12px;
        font-size: clamp(1.2rem, 3vw, 1.9rem);
        font-weight: 800;
        color: #edf6ff;
        user-select: none;
      }
      .overlay {
        position: absolute;
        inset: 10px;
        display: none;
        place-items: center;
        border-radius: 18px;
        background: rgba(7, 12, 20, 0.75);
        text-align: center;
        padding: 20px;
      }
      .overlay.visible {
        display: grid;
      }
      .overlay h2 {
        margin: 0 0 10px;
        font-size: clamp(1.5rem, 3vw, 2rem);
      }
      .overlay p {
        margin: 0 0 14px;
        color: var(--muted);
      }
      .controls {
        display: flex;
        gap: 10px;
        margin-top: 18px;
      }
      .button {
        flex: 1;
        border: none;
        border-radius: 12px;
        padding: 12px 14px;
        font-weight: 800;
        cursor: pointer;
      }
      .button.primary {
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: #06141f;
      }
      .button.secondary {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(160, 179, 255, 0.14);
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <div class="game-wrap">
      <div class="topbar">
        <h1>2048</h1>
        <div class="score-panel">
          <div class="pill">
            <span class="pill-label">Score</span>
            <span class="pill-value" id="score">0</span>
          </div>
          <div class="pill">
            <span class="pill-label">Best</span>
            <span class="pill-value" id="best">0</span>
          </div>
        </div>
      </div>

      <div class="board-wrap">
        <div id="board" class="board" aria-label="2048 game board"></div>
        <div id="overlay" class="overlay">
          <div>
            <h2 id="overlay-title">You Win!</h2>
            <p id="overlay-text">Press restart to play again.</p>
            <button id="overlay-btn" class="button primary">Restart</button>
          </div>
        </div>
      </div>

      <div class="controls">
        <button id="restartBtn" class="button secondary">Restart</button>
        <button id="backBtn" class="button primary">Back</button>
      </div>
    </div>

    <script>
      const size = 4;
      const boardEl = document.getElementById('board');
      const overlayEl = document.getElementById('overlay');
      const overlayTitleEl = document.getElementById('overlay-title');
      const overlayTextEl = document.getElementById('overlay-text');
      const scoreEl = document.getElementById('score');
      const bestEl = document.getElementById('best');
      const restartBtn = document.getElementById('restartBtn');
      const backBtn = document.getElementById('backBtn');
      const overlayBtn = document.getElementById('overlay-btn');

      let board = [];
      let score = 0;
      let best = Number(localStorage.getItem('pixelpulse-2048-best') || 0);
      let gameOver = false;
      let touchStartX = 0;
      let touchStartY = 0;

      function emptyBoard() {
        return Array(size * size).fill(0);
      }

      function getTileColor(value) {
        const colors = {
          0: 'rgba(255, 255, 255, 0.08)',
          2: '#eee4da',
          4: '#eae0c8',
          8: '#f2b179',
          16: '#f59563',
          32: '#f67c5f',
          64: '#f65e3b',
          128: '#edcf72',
          256: '#edcc61',
          512: '#edc850',
          1024: '#edc53f',
          2048: '#3ee3a4',
        };
        return colors[value] || '#66d9ff';
      }

      function renderBoard() {
        const cells = boardEl.children;
        for (let i = 0; i < board.length; i++) {
          const cell = cells[i];
          const value = board[i];
          cell.textContent = value === 0 ? '' : value;
          cell.style.background = getTileColor(value);
          cell.style.color = value <= 4 ? '#1d2d3d' : '#edf6ff';
        }
        scoreEl.textContent = String(score);
        bestEl.textContent = String(best);
      }

      function fillBoard() {
        boardEl.innerHTML = '';
        for (let i = 0; i < size * size; i++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          boardEl.appendChild(cell);
        }
      }

      function addRandomTile() {
        const emptyIndexes = board
          .map((value, index) => (value === 0 ? index : -1))
          .filter((index) => index !== -1);
        if (!emptyIndexes.length) return;
        const index = emptyIndexes[Math.floor(Math.random() * emptyIndexes.length)];
        board[index] = Math.random() < 0.9 ? 2 : 4;
      }

      function slideLine(line) {
        const filtered = line.filter((value) => value !== 0);
        const merged = [];
        for (let i = 0; i < filtered.length; i++) {
          if (filtered[i] === filtered[i + 1]) {
            const value = filtered[i] * 2;
            merged.push(value);
            score += value;
            best = Math.max(best, score);
            i += 1;
          } else {
            merged.push(filtered[i]);
          }
        }
        while (merged.length < size) merged.push(0);
        return merged;
      }

      function move(direction) {
        if (gameOver) return;
        const prev = board.slice();
        const nextBoard = emptyBoard();

        if (direction === 'left' || direction === 'right') {
          for (let row = 0; row < size; row++) {
            let line = [];
            for (let col = 0; col < size; col++) {
              line.push(board[row * size + col]);
            }
            if (direction === 'right') line = line.reverse();
            const moved = slideLine(line);
            const finalLine = direction === 'right' ? moved.reverse() : moved;
            for (let col = 0; col < size; col++) {
              nextBoard[row * size + col] = finalLine[col];
            }
          }
        }

        if (direction === 'up' || direction === 'down') {
          for (let col = 0; col < size; col++) {
            let line = [];
            for (let row = 0; row < size; row++) {
              line.push(board[row * size + col]);
            }
            if (direction === 'down') line = line.reverse();
            const moved = slideLine(line);
            const finalLine = direction === 'down' ? moved.reverse() : moved;
            for (let row = 0; row < size; row++) {
              nextBoard[row * size + col] = finalLine[row];
            }
          }
        }

        if (prev.every((value, index) => value === nextBoard[index])) {
          return;
        }

        board = nextBoard;
        addRandomTile();
        if (board.some((value) => value >= 2048)) {
          overlayTitleEl.textContent = 'You Win!';
          overlayTextEl.textContent = 'Keep going and try to beat your best score.';
          overlayEl.classList.add('visible');
        }
        if (!hasMoves()) {
          gameOver = true;
          overlayTitleEl.textContent = 'Game Over';
          overlayTextEl.textContent = 'No more moves left. Hit restart and try again.';
          overlayEl.classList.add('visible');
        }
        renderBoard();
      }

      function hasMoves() {
        if (board.some((value) => value === 0)) return true;
        for (let i = 0; i < board.length; i++) {
          if (i % size !== size - 1 && board[i] === board[i + 1]) return true;
          if (i < board.length - size && board[i] === board[i + size]) return true;
        }
        return false;
      }

      function restartGame() {
        board = emptyBoard();
        score = 0;
        gameOver = false;
        overlayEl.classList.remove('visible');
        addRandomTile();
        addRandomTile();
        renderBoard();
      }

      document.addEventListener('keydown', (event) => {
        const key = event.key.toLowerCase();
        if (['arrowleft', 'arrowright', 'arrowup', 'arrowdown', 'a', 'd', 'w', 's'].includes(key)) {
          event.preventDefault();
        }
        if (key === 'arrowleft' || key === 'a') move('left');
        if (key === 'arrowright' || key === 'd') move('right');
        if (key === 'arrowup' || key === 'w') move('up');
        if (key === 'arrowdown' || key === 's') move('down');
      });

      boardEl.addEventListener('touchstart', (event) => {
        const touch = event.changedTouches[0];
        touchStartX = touch.clientX;
        touchStartY = touch.clientY;
      }, { passive: true });

      boardEl.addEventListener('touchend', (event) => {
        const touch = event.changedTouches[0];
        const dx = touch.clientX - touchStartX;
        const dy = touch.clientY - touchStartY;
        if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
        if (Math.abs(dx) > Math.abs(dy)) {
          move(dx > 0 ? 'right' : 'left');
        } else {
          move(dy > 0 ? 'down' : 'up');
        }
      }, { passive: true });

      restartBtn.addEventListener('click', restartGame);
      overlayBtn.addEventListener('click', restartGame);
      backBtn.addEventListener('click', () => {
        window.location.href = '../index.html';
      });

      fillBoard();
      restartGame();
    </script>
  </body>
</html>
