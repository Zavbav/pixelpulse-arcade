<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Player | PixelPulse Arcade</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body data-page="game">
    <header class="game-header">
      <button id="backBtn" aria-label="Back to library">← Library</button>
      <div class="game-meta">
        <h1 id="gameTitle">Loading game...</h1>
      </div>
      <div class="game-controls">
        <button id="reloadBtn" class="game-action-btn" aria-label="Reload game">Reload</button>
        <button id="fullscreenBtn" class="game-action-btn" aria-label="Fullscreen game">Fullscreen</button>
      </div>
    </header>

    <main class="game-stage">
      <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-box">
          <div class="spinner"></div>
          <span>Loading game...</span>
        </div>
      </div>

      <iframe id="gameFrame" title="Game player" allow="fullscreen"></iframe>

      <div id="unavailablePanel" class="unavailable-panel hidden" aria-live="polite">
        <div class="unavailable-box">
          <h2>Not available here</h2>
          <p id="statusText">This game cannot be played in this static build because its files or licenses are not authorized for redistribution.</p>
          <button class="primary-btn" onclick="window.location.href='./index.html'">Back to games</button>
        </div>
      </div>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
