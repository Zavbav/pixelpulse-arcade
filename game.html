<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Play Game | PixelPulse Arcade</title>
<link rel="stylesheet" href="./style.css">
</head>
<body data-page="game">
<main class="game-shell">
<header class="game-header">
<button id="backBtn" type="button">Back to games</button>
<div class="game-meta"><h1 id="gameTitle">Loading game...</h1></div>
<div class="game-controls">
<button id="reloadBtn" class="game-action-btn" type="button">Reload</button>
<button id="fullscreenBtn" class="game-action-btn" type="button">Fullscreen</button>
</div>
</header>
<section class="game-stage" aria-label="Game player">
<div id="loadingOverlay" class="loading-overlay"><div class="loading-box"><div class="spinner" aria-hidden="true"></div><p>Loading game...</p></div></div>
<iframe id="gameFrame" title="Game" allow="fullscreen; autoplay" loading="eager"></iframe>
<div id="unavailablePanel" class="unavailable-panel hidden"><div class="unavailable-box"><h2>Game unavailable</h2><p id="statusText">This game is not available in this version.</p><button id="unavailableBackBtn" type="button">Back to games</button></div></div>
</section>
</main>
<script src="./script.js?v=5"></script>
</body>
</html>
